 }catch(error){state.evidence[l.id]={error:String(error.message||error),results:[]}}

}

  const listed=[...new Map([...state.sources.map(x=>[x.name,{...x,server:false}]),...state.serverSources.map(x=>[x.name,{name:x.name,length:x.size,server:true}])]).values()];
  $('personalSources').innerHTML=listed.length?listed.map((item,i)=>`<div class="material-item"><span>▤</span><div><b>${esc(item.name)}</b><br><span>${(item.length/1024).toFixed(1)} KB · ${item.server?'本地资料夹':'仅此浏览器'}</span></div><button class="material-action" data-delete="${i}">移除</button></div>`).join(''):'<p class="source-subtitle">暂无个人补充笔记；正式教材已在上方资料库中。</p>';
  box.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{const item=listed[Number(button.dataset.delete)];if(!item)return;button.disabled=true;if(item.server&&state.serviceAvailable){try{const response=await fetch('/api/material?name='+encodeURIComponent(item.name),{method:'DELETE'});if(!response.ok)throw Error((await response.json()).error||'移除失败')}catch(error){button.disabled=false;toast(String(error.message||error));return}}state.serverSources=state.serverSources.filter(x=>x.name!==item.name);state.sources=state.sources.filter(x=>x.name!==item.name);save();renderTab();toast('个人笔记已移除')});
  $('sourceFile').onchange=async event=>{for(const file of [...event.target.files]){if(!/\.(md|txt)$/i.test(file.name)||file.size>100000){toast('仅支持 100 KB 以内的 MD / TXT');continue}const content=await file.text();state.sources=state.sources.filter(x=>x.name!==file.name);state.sources.push({name:file.name,text:content.slice(0,100000),length:file.size});if(state.sources.length>10)state.sources.shift();save();if(state.serviceAvailable){try{const response=await fetch('/api/material',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:file.name,text:content})});if(!response.ok)throw Error();const data=await response.json();state.serverSources=state.serverSources.filter(x=>x.name!==data.name);state.serverSources.push({name:data.name,size:file.size});toast('笔记已保存到本地课程项目')}catch{toast('笔记已存浏览器，但同步本地服务失败')}}else toast('笔记已存浏览器')}renderTab()};
 }else if(state.tab==='think'){
  box.innerHTML=`<div class="reflections"><div class="reflection-item"><b>本节工作产物：</b> ${esc(l.artifact)}</div><div class="reflection-item"><b>迁移问题：</b> ${esc(l.think)}</div><div class="reflection-item">先写下你的判断、依据和失败条件，再让实时 AI 导师追问。没有预设唯一答案。</div><button class="btn-primary" id="askThink" style="width:max-content">与导师讨论 ↗</button></div>`;
  $('askThink').onclick=()=>sendQuestion(l.think);
 }
}
function renderNotePeek(){const l=cur(),note=(state.notes[l.id]||'').trim();$('notePeek').innerHTML=`<div class="mini-note"><span>▣</span><div><strong>${esc(l.title)}核心概念</strong><small>${esc(note?note.slice(0,50)+(note.length>50?'…':''):'用自己的话写下今天学到的东西')}</small></div></div><div class="mini-note"><span>✧</span><div><strong>我的下一步</strong><small>${esc(l.artifact.slice(0,38))}…</small></div></div>`}
function changeLesson(id){if(!COURSE.some(l=>l.id===id))return;state.lesson=id;state.expanded=cur().section;state.board=0;state.fold=0;state.tab='notes';save();renderAll();if(!state.connected){$('chatLog').innerHTML='';introChat()}if(window.innerWidth<740)$('blackboard').scrollIntoView({behavior:'smooth',block:'center'})}
function renderAll(){renderSidebar();renderBoard();renderTab();renderNotePeek();$('career').value=state.career}
function addMessage(role,text){const div=document.createElement('div');div.className='chatbubble '+role;div.textContent=text;$('chatLog').append(div);$('chatLog').scrollTop=$('chatLog').scrollHeight;return div}
function introChat(){addMessage('system','本节：'+cur().title+'。连接实时 AI 导师后，可以围绕讲课笔记、教材或工作产物继续提问。')}
async function sendQuestion(message){const text=String(message||'').trim();if(!text||state.busy)return;if(text.length>2000){toast('一次输入不要超过 2000 字');return}if(!state.connected){toast('请先连接实时 AI 导师');return}addMessage('user',text);$('chatInput').value='';state.busy=true;$('sendBtn').disabled=true;const pending=addMessage('system','导师正在整理回答…');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,session:state.session,lessonId:state.lesson,career:state.career,page:state.board,practice:state.tab==='practice'})});const data=await r.json();pending.remove();if(!r.ok)throw Error(data.error||'导师暂时没有返回结果');state.session=data.session||state.session;addMessage('assistant',data.reply||'本轮没有获得文本答复。')}catch(e){pending.remove();addMessage('system','连接未完成：'+String(e.message||e));state.connected=false;updateConnection()}finally{state.busy=false;$('sendBtn').disabled=false}}
function updateConnection(){const connected=state.connected;$('statusText').textContent=connected?'AI 导师 · 实时对话':state.available?'服务已启动 · 等待连接':'未连接 · 课程可阅读';$('statusDot').classList.toggle('off',!connected);$('connectBtn').textContent=connected?'✓ AI 导师已连接':state.available?'连接实时 AI 导师 ↗':'连接实时 AI 导师 ↗';$('modeHelp').textContent=connected?'回答由实时 AI 生成，会结合本地教材摘录；引用仍需核对':'提问与面试需要连接实时 AI 导师'}
async function checkService(){try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),2500);const r=await fetch('/api/status',{signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw Error();const data=await r.json();state.serviceAvailable=true;state.available=!!data.sdk;updateConnection();try{const [libraryResponse,materialsResponse]=await Promise.all([fetch('/api/library'),fetch('/api/materials')]);if(libraryResponse.ok)state.library=await libraryResponse.json();if(materialsResponse.ok)state.serverSources=(await materialsResponse.json()).items||[];if(state.tab==='source')renderTab()}catch{}}catch{state.serviceAvailable=false;state.available=false;updateConnection()}}
async function connect(){if(state.connected){toast('已经处于实时对话模式');return}if(!state.available){toast('请先在项目目录运行 npm install 和 npm run dev，并用 http://127.0.0.1:3000 打开');return}if(state.connecting)return;state.connecting=true;$('connectBtn').disabled=true;$('connectBtn').textContent='正在连接 AI 导师…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'请用一句话向学生问好，并基于当前课程提出一个思考问题。',career:state.career,lessonId:state.lesson,page:state.board})});const data=await r.json();if(!r.ok)throw Error(data.error||'连接失败');state.session=data.session||null;state.connected=true;addMessage('assistant',data.reply);toast('实时导师已连接')}catch(e){toast('连接失败：'+e.message)}finally{state.connecting=false;$('connectBtn').disabled=false;updateConnection()}}
function exportStudy(){const record={exportedAt:new Date().toISOString(),career:state.career,completedLessons:Object.keys(state.done).filter(id=>state.done[id]),answers:state.answers,notes:state.notes,sourceNames:[...new Set([...state.sources.map(x=>x.name),...state.serverSources.map(x=>x.name)])]};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='AI导师-学习记录-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出')}
function showStats(){const n=completed(),correct=COURSE.filter(l=>state.answers[l.id]?.correct).length,notes=Object.values(state.notes).filter(x=>x?.trim()).length;$('statFinished').textContent=n;$('statCorrect').textContent=correct;$('statNotes').textContent=notes;$('statDetails').textContent=`目标岗位：${state.career} · 课程 ${COURSE.length} 节 · 已通过 ${n} 节练习。学习进度保存在本机浏览器中。`;$('statsModal').classList.remove('hidden')}
$('career').onchange=e=>{state.career=e.target.value;save();toast('目标已更新，导师将按此岗位调整教学')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTab()});$('sourceBtn').onclick=()=>{state.tab='source';renderTab();$('tabPage').scrollIntoView({behavior:'smooth',block:'nearest'})};$('prevBoard').onclick=()=>{state.board=(state.board+1)%2;renderBoard()};$('nextBoard').onclick=()=>{state.board=(state.board+1)%2;renderBoard()};$('prevLesson').onclick=()=>{const i=COURSE.findIndex(l=>l.id===state.lesson);changeLesson(COURSE[(i-1+COURSE.length)%COURSE.length].id)};$('nextLesson').onclick=()=>{const i=COURSE.findIndex(l=>l.id===state.lesson);changeLesson(COURSE[(i+1)%COURSE.length].id)};$('exportStudy').onclick=exportStudy;$('statsBtn').onclick=showStats;$('profileBtn').onclick=showStats;$('closeStats').onclick=()=>$('statsModal').classList.add('hidden');$('statsModal').onclick=e=>{if(e.target===$('statsModal'))$('statsModal').classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('statsModal').classList.add('hidden')});$('libraryBtn').onclick=()=>{state.tab='source';renderTab();$('tabPage').scrollIntoView({behavior:'smooth',block:'nearest'})};$('addNote').onclick=()=>{state.tab='notes';renderTab();$('tabPage').scrollIntoView({behavior:'smooth',block:'nearest'});$('noteText')?.focus()};$('connectBtn').onclick=connect;$('chatForm').onsubmit=e=>{e.preventDefault();sendQuestion($('chatInput').value)};$('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQuestion(e.target.value)}};document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>sendQuestion(b.dataset.question));renderAll();introChat();updateConnection();checkService();
</script>
</body>
</html>
